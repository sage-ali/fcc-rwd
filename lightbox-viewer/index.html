<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightbox Viewer</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <header id="header">

  </header>
  <main id="main-doc" class="container">
    <div class="gallery"><img class="gallery-item"
        src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
        alt="Stonehenge"><img class="gallery-item"
        src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
        alt="Storm"><img class="gallery-item"
        src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
        alt="Trees"></div>
    <div class="lightbox">
      <button id="close-btn">&times;</button>
      <img src="" alt="" id="lightbox-image">
    </div>
  </main>
  <footer>
    <p>Created by <a href="https://github.com/sage-ali">sage-ali</a></p>
  </footer>
</body>
<script src="scripts/script.js"></script>

</html>
