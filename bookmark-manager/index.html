<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <main>
    <section id="main-section">
      <h1>Bookmark Manager</h1>
      <div id="dropdown">
        <label for="category-dropdown">Select a category:</label>
        <select id="category-dropdown" name="options">
          <option value="news" selected>News</option>
          <option value="entertainment">Entertainment</option>
          <option value="work">Work</option>
          <option value="miscellaneous">Miscellaneous</option>
        </select>
      </div>
      <div id="buttons">
        <button type="button" id="view-category-button">View Category</button>
        <button type="button" id="add-bookmark-button">Add Bookmark</button>
      </div>
    </section>

    <section id="form-section" class="hidden">
      <form>
        <h2 class="category-name"></h2>
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name">
        </div>
        <div>
          <label for="url">URL:</label>
          <input type="text" id="url">
        </div>
        <div>
          <button type="button" id="close-form-button">Go Back</button>
          <button type="button" id="add-bookmark-button-form">Add
            Bookmark</button>
        </div>
      </form>
    </section>

    <section id="bookmark-list-section" class="hidden">
      <h2 class="category-name"></h2>
      <div id="category-list">
      </div>
      <div>
        <button type="button" id="close-list-button">Go Back</button>
        <button type="button" id="delete-bookmark-button">Delete
          Bookmark</button>
      </div>
    </section>

  </main>

  <footer>
    <p>Created by <a href="https://github.com/sage-ali">sage-ali</a></p>
  </footer>
</body>
<script src="scripts/script.js"></script>

</html>
